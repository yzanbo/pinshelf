# XcodeGen の設定。`xcodegen generate` で Pinshelf.xcodeproj を作る
name: Pinshelf
options:
  bundleIdPrefix: app.pinshelf
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: ja

settings:
  base:
    SWIFT_VERSION: "6.0"

targets:
  # 画面に依存しない中心のロジック（`swift test` でも同じソースを使う）。
  # アプリに埋め込むフレームワークにすると、自前の証明書で署名したときに読み込みを断られることがあるので、静的ライブラリにする
  PinshelfCore:
    type: library.static
    platform: macOS
    sources:
      - path: PinshelfCore/Sources/PinshelfCore
    settings:
      base:
        PRODUCT_NAME: PinshelfCore
        SKIP_INSTALL: YES

  PinshelfCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PinshelfCore/Tests/PinshelfCoreTests
    dependencies:
      - target: PinshelfCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pinshelf.PinshelfCoreTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

  Pinshelf:
    type: application
    platform: macOS
    sources:
      - path: Pinshelf
    dependencies:
      - target: PinshelfCore
    info:
      path: Pinshelf/Info.plist
      properties:
        CFBundleDisplayName: Pinshelf
        CFBundleDevelopmentRegion: ja
        # 日本語のアプリだと宣言する（しないと、文字の欄の右クリックなど、macOS の部品が英語で出る）
        CFBundleLocalizations:
          - ja
        # アプリの版（make dist・make publish もここから読む）。1.0.0 より前は β 版（設定画面にも「β 版」と出る）。
        # 出すたびに上げる。CFBundleVersion（ビルド番号）も 1 つずつ上げる
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSApplicationCategoryType: public.app-category.productivity
        # メニューバーに常駐し、Dock には出さない
        LSUIElement: true
        NSHumanReadableCopyright: ""
    entitlements:
      path: Pinshelf/Pinshelf.entitlements
      properties:
        # App Store に出せるようにサンドボックスを有効にする
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # 再起動後も棚のファイルを開けるように、security-scoped bookmark を使う
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.pinshelf.Pinshelf
        PRODUCT_NAME: Pinshelf
        # 開発中はその場の署名（自分の Mac で動かす用）。配布するときは Team を設定する
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        # 型は既定で MainActor にする（画面まわりのコードが多いため）
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        GENERATE_INFOPLIST_FILE: NO
        # アプリのアイコン（scripts/make-app-icon.swift で描いて、make icon で書き出す）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Debug ではアプリのコードを Pinshelf.debug.dylib に分けて読み込む。
        # 自前の証明書（Pinshelf Dev）で署名しても読み込みを断られないよう、Debug だけ Hardened Runtime を切る
        Debug:
          ENABLE_HARDENED_RUNTIME: NO

schemes:
  Pinshelf:
    build:
      targets:
        Pinshelf: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PinshelfCoreTests
